version: '3.8'

x-backend-worker-common: &backend-worker-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
    - REDIS_URL=redis://redis:6379
    - PYTHONPATH=/app
  depends_on:
    - postgres
    - redis
  volumes:
    - ./backend:/app
  networks:
    - stock_network
  profiles:
    - workers

services:
  # PostgreSQL 資料庫
  postgres:
    image: postgres:15
    container_name: stock_analysis_db
    environment:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock_network

  # Redis 快取
  redis:
    image: redis:7-alpine
    container_name: stock_analysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock_network

  # FastAPI 後端服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analysis_backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env  # 使用 backend 目錄下的 .env 文件
        required: false
    environment:
      # Application data DB. Uses root .env DATABASE_URL when present; falls back to local Postgres.
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - stock_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  order-execution-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_order_execution_worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - ORDER_EXECUTION_QUEUE_CONSUMER_NAME=order-execution-worker
    command: python -m scripts.run_worker order-execution

  broker-sync-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_broker_sync_worker
    command: python -m scripts.run_worker broker-sync

  market-data-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_market_data_worker
    command: python -m scripts.run_worker market-data

  bar-aggregation-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_bar_aggregation_worker
    command: python -m scripts.run_worker bar-aggregation

  data-validation-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_data_validation_worker
    command: python -m scripts.run_worker data-validation

  indicator-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_indicator_worker
    command: python -m scripts.run_worker indicator

  strategy-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_strategy_worker
    command: python -m scripts.run_worker strategy

  notification-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_notification_worker
    command: python -m scripts.run_worker notification

  # React 前端應用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: stock_analysis_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - stock_network
    depends_on:
      - backend
    command: npm run dev

  # Apache Airflow Webserver
  airflow-webserver:
    build:
      context: ./airflow
    image: kiro-stock-platform-airflow:latest
    container_name: stock_analysis_airflow_webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/stock_analysis
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-32-chars-long
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Taipei
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE=False
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://backend:8000/api/v1
      - PYTHONPATH=/opt/airflow/dags:/opt/airflow:/opt/airflow/backend
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend:/opt/airflow/backend
    depends_on:
      - postgres
      - redis
    networks:
      - stock_network
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
        airflow webserver --port 8080
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
    image: kiro-stock-platform-airflow:latest
    container_name: stock_analysis_airflow_scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/stock_analysis
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-32-chars-long
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Taipei
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://backend:8000/api/v1
      - PYTHONPATH=/opt/airflow/dags:/opt/airflow:/opt/airflow/backend
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend:/opt/airflow/backend
    depends_on:
      - postgres
      - redis
      - airflow-webserver
    networks:
      - stock_network
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  stock_network:
    driver: bridge
