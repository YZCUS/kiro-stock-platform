name: kiro-stock-platform

x-backend-worker-common: &backend-worker-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
    - REDIS_URL=redis://redis:6379
    - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    - FINNHUB_BASE_URL=${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
    - FINNHUB_WS_URL=${FINNHUB_WS_URL:-wss://ws.finnhub.io}
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
    - DATABASE_POOL_SIZE=${WORKER_DATABASE_POOL_SIZE:-2}
    - DATABASE_MAX_OVERFLOW=${WORKER_DATABASE_MAX_OVERFLOW:-1}
    - PYTHONPATH=/app
  depends_on:
    - postgres
    - redis
  volumes:
    - ./backend:/app
  networks:
    - stock_network
  profiles:
    - workers

services:
  # PostgreSQL 資料庫
  postgres:
    image: postgres:15
    container_name: stock_analysis_db
    environment:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock_network

  # Redis 快取
  redis:
    image: redis:7-alpine
    container_name: stock_analysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock_network

  # FastAPI 後端服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analysis_backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env  # 使用 backend 目錄下的 .env 文件
        required: false
    environment:
      # Application data DB. Uses root .env DATABASE_URL when present; falls back to local Postgres.
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FINNHUB_BASE_URL=${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      - FINNHUB_WS_URL=${FINNHUB_WS_URL:-wss://ws.finnhub.io}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - DATABASE_POOL_SIZE=${BACKEND_DATABASE_POOL_SIZE:-5}
      - DATABASE_MAX_OVERFLOW=${BACKEND_DATABASE_MAX_OVERFLOW:-5}
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - stock_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  order-execution-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_order_execution_worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - ORDER_EXECUTION_QUEUE_CONSUMER_NAME=order-execution-worker
      - DATABASE_POOL_SIZE=${WORKER_DATABASE_POOL_SIZE:-2}
      - DATABASE_MAX_OVERFLOW=${WORKER_DATABASE_MAX_OVERFLOW:-1}
    command: python -m scripts.run_worker order-execution

  broker-sync-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_broker_sync_worker
    command: python -m scripts.run_worker broker-sync

  market-data-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_market_data_worker
    command: python -m scripts.run_worker market-data

  bar-aggregation-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_bar_aggregation_worker
    command: python -m scripts.run_worker bar-aggregation

  data-validation-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_data_validation_worker
    command: python -m scripts.run_worker data-validation

  indicator-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_indicator_worker
    command: python -m scripts.run_worker indicator

  strategy-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_strategy_worker
    command: python -m scripts.run_worker strategy

  notification-worker:
    <<: *backend-worker-common
    container_name: stock_analysis_notification_worker
    command: python -m scripts.run_worker notification

  qlib-prediction-service:
    build:
      context: ./qlib_service
    container_name: stock_analysis_qlib_prediction_service
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - QLIB_INTERNAL_TOKEN=${QLIB_INTERNAL_TOKEN:-dev-qlib-token}
      - QLIB_ARTIFACT_ROOT=/app/artifacts
      - QLIB_PROVIDER_URI=/app/artifacts/provider
      - QLIB_DATABASE_POOL_SIZE=${QLIB_DATABASE_POOL_SIZE:-2}
      - QLIB_DATABASE_MAX_OVERFLOW=${QLIB_DATABASE_MAX_OVERFLOW:-1}
    depends_on:
      - postgres
    volumes:
      - ./qlib_service/app:/app/app
      - qlib_artifacts:/app/artifacts
    networks:
      - stock_network

  airflow-db-prepare:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - AIRFLOW_DB=airflow
      - AIRFLOW_DB_PREPARE_MAX_ATTEMPTS=60
    volumes:
      - ./scripts/ensure-airflow-db.sh:/scripts/ensure-airflow-db.sh:ro
    command: ["sh", "/scripts/ensure-airflow-db.sh"]
    depends_on:
      - postgres
    networks:
      - stock_network

  # React 前端應用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: stock_analysis_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_MARKET_WS_URL=ws://localhost:8000/ws/market
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - stock_network
    depends_on:
      - backend
    command: npm run dev

  # Apache Airflow Webserver
  airflow-webserver:
    build:
      context: ./airflow
    image: kiro-stock-platform-airflow:latest
    container_name: stock_analysis_airflow_webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__PARALLELISM=${AIRFLOW_PARALLELISM:-4}
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-4}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE=${AIRFLOW_DATABASE_POOL_SIZE:-5}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW=${AIRFLOW_DATABASE_MAX_OVERFLOW:-5}
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Taipei
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE=False
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://backend:8000/api/v1
      - QLIB_PREDICTION_URL=http://qlib-prediction-service:8090
      - QLIB_INTERNAL_TOKEN=${QLIB_INTERNAL_TOKEN:-dev-qlib-token}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - PYTHONPATH=/opt/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      airflow-db-prepare:
        condition: service_completed_successfully
      qlib-prediction-service:
        condition: service_started
    networks:
      - stock_network
    command: >
      bash -ec "
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || airflow users list | grep -F admin) &&
        exec airflow webserver --port 8080
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
    image: kiro-stock-platform-airflow:latest
    container_name: stock_analysis_airflow_scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__PARALLELISM=${AIRFLOW_PARALLELISM:-4}
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-4}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE=${AIRFLOW_DATABASE_POOL_SIZE:-5}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW=${AIRFLOW_DATABASE_MAX_OVERFLOW:-5}
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Taipei
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/stock_analysis}
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://backend:8000/api/v1
      - QLIB_PREDICTION_URL=http://qlib-prediction-service:8090
      - QLIB_INTERNAL_TOKEN=${QLIB_INTERNAL_TOKEN:-dev-qlib-token}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
      - redis
      - airflow-webserver
    networks:
      - stock_network
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  qlib_artifacts:

networks:
  stock_network:
    driver: bridge
